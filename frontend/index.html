<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tensors Bird Game</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <!-- Particles Canvas (behind start page) -->
  <canvas id="particles-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;"></canvas>
  
  <div id="start-page" class="container">
    <div class="content">
      <img src="assets/tensors-logo-running.png" alt="Tensors Logo" class="logo">
      <h1>Tensors Bird Game</h1>
      <p>Hit 1000 points for a surprise</p>
      <div class="button-group">
        <button id="play-button" class="button glass">Play Game</button>
        <button id="signin-button" class="button glass">Sign in for Leaderboard</button>
      </div>
      <h2>Leaderboard</h2>
      <table id="leaderboard-table" class="glass">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Name (Dept)</th>
            <th>Score</th>
            <th>Reward</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="social-buttons">
        <a href="https://www.instagram.com/tensors_official/" target="_blank" class="button glass">Instagram</a>
        <a href="https://tensors.in/" target="_blank" class="button glass">Website</a>
      </div>
    </div>
  </div>
  
  <!-- Sign-in Modal -->
  <div id="signin-modal" class="modal" style="display: none;">
    <div class="modal-content glass">
      <h2>Sign In</h2>
      <p>Enter details to appear on leaderboard and refer friends</p>
      <form id="signin-form">
        <input type="text" id="signin-name-input" placeholder="Your Name">
        <input type="email" id="signin-email-input" placeholder="IIT Madras Email">
        <button type="submit" id="submit-signin" class="button glass">Submit</button>
      </form>
      <button id="close-signin" class="button glass">Close</button>
    </div>
  </div>
  
  <!-- Game Canvas and HUD -->
  <canvas id="game-canvas" style="display: none;"></canvas>
  <div id="hud" style="display: none;" class="glass">
    <span id="score-display">Score: 0 | Lives: 1</span>
  </div>
  
  <!-- Milestone Modal -->
  <div id="milestone-modal" class="modal" style="display: none;">
    <div class="modal-content glass">
      <h2>Congrats! 1000 Points Milestone</h2>
      <p>Enter details for "Day with Tensors."</p>
      <form id="milestone-form">
        <input type="text" id="milestone-name-input" placeholder="Your Name">
        <input type="email" id="milestone-email-input" placeholder="IIT Madras Email">
        <button type="submit" id="submit-milestone" class="button glass">Submit</button>
      </form>
      <button id="close-milestone" class="button glass">Close</button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- Game Over Modal -->
  <div id="game-over-modal" class="modal" style="display: none;">
    <div class="modal-content glass">
      <h2>Game Over</h2>
      <p>Your Score: <span id="final-score"></span></p>
      
      <button id="restart-button" class="button glass">Restart</button>
      <button id="referral-button" class="button glass">Refer a Friend to Revive</button>
      <button id="menu-button" class="button glass">Back to Menu</button>
  </div>
  
  <script>
    console.log('index.html scripts loading');
  </script>
  <script type="module" src="scripts/ui.js"></script>
  <script type="module" src="scripts/game.js"></script>
  <script type="module" src="scripts/api.js"></script>
</body>
</html>
